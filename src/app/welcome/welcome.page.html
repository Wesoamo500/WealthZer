<ion-header class="ion-no-border">
  <ion-toolbar color="background">
    <div class="header-content">
      <div class="logo-wrapper">
        <ion-icon name="stop-outline" class="logo-box"></ion-icon>
        <span class="logo-text">wealthZer</span>
      </div>
      <ion-buttons slot="end">
        <ion-button class="notification-btn">
          <ion-icon name="notifications" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-avatar class="profile-avatar">
          <ion-icon name="person"></ion-icon>
        </ion-avatar>
      </ion-buttons>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="welcome-container">
    <div class="graphic-section">
      <div class="glow-bg"></div>
      <div class="chart-stack">
        <!-- Background elements -->
        <div class="card bg-card-1"></div>
        <div class="circle-outline"></div>
        
        <!-- Main Card -->
        <div class="main-card">
          <div class="chart-container">
            <svg viewBox="0 0 100 60" class="chart-line">
              <path d="M10,50 L30,40 L50,45 L70,25 L90,15" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="chart-lines">
               <div class="h-line"></div>
               <div class="h-line"></div>
            </div>
          </div>
          <div class="card-bars">
            <div class="bar" style="height: 20%"></div>
            <div class="bar" style="height: 40%"></div>
            <div class="bar" style="height: 30%"></div>
            <div class="bar" style="height: 60%"></div>
            <div class="bar" style="height: 50%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="welcome-text-section">
      <h1 class="welcome-title">Welcome to wealthZer</h1>
      <p class="welcome-description">
        Start your financial journey by adding your assets manually to get a real-time overview of your net worth, investments, and spending.
      </p>
    </div>

    <div class="action-section">
      <ion-button expand="block" class="get-started-btn" (click)="getStarted()">
        Get Started
      </ion-button>
      
      <div class="security-badge">
        <ion-icon name="shield-checkmark" class="shield-icon"></ion-icon>
        <span>BANK-GRADE SECURITY</span>
      </div>
    </div>
  </div>
</ion-content>
