<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="ion-text-center">ADD TRANSACTION</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" color="dark">
  
  <!-- Amount Input -->
  <div class="amount-section" (click)="focusAmountInput()">
    <p class="enter-amount-label">ENTER AMOUNT</p>
    <div class="amount-display">
      <span class="currency-symbol">{{ currencyService.getCurrencyInfo().symbol }}</span>
      <span class="amount-value">{{ displayAmount }}</span>
      <span class="cursor" *ngIf="isAmountFocused">|</span>
    </div>
    <input 
      #amountInput
      type="number" 
      [(ngModel)]="amount" 
      (focus)="isAmountFocused = true"
      (blur)="isAmountFocused = false"
      (input)="updateDisplayAmount()"
      class="hidden-input"
      inputmode="decimal"
      step="0.01"
    />
  </div>

  <!-- Title Input -->
  <div class="note-section" style="margin-bottom: 20px;">
    <label>TRANSACTION TITLE</label>
    <ion-input 
      [(ngModel)]="title" 
      placeholder="e.g. Starbucks, Rent, Grocery"
      class="note-input"
    ></ion-input>
  </div>

  <!-- Category Selection -->
  <div class="category-section">
    <div class="section-header">
      <span>CATEGORY</span>
      <ion-badge color="primary">AI SUGGESTED</ion-badge>
    </div>
    
    <div class="category-grid">
      <div 
        *ngFor="let cat of categories" 
        class="category-item"
        [class.selected]="selectedCategory === cat.id"
        (click)="selectCategory(cat.id)"
      >
        <div class="category-icon">
          <ion-icon [name]="cat.icon"></ion-icon>
        </div>
        <span>{{ cat.label }}</span>
      </div>
    </div>
  </div>

  <!-- Date and Account -->
  <div class="details-section">
    <div class="detail-row">
      <div class="detail-item">
        <label>DATE</label>
        <ion-datetime-button datetime="datetime"></ion-datetime-button>
        <ion-popover [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime id="datetime" presentation="date" [(ngModel)]="selectedDate"></ion-datetime>
          </ng-template>
        </ion-popover>
      </div>
      
      <div class="detail-item">
        <label>ACCOUNT</label>
        <ion-select [(ngModel)]="selectedAccount" interface="popover" toggleIcon="v-down" class="detail-select">
          <ion-select-option *ngFor="let acc of accounts" [value]="acc.id">{{ acc.label }}</ion-select-option>
        </ion-select>
      </div>
    </div>
  </div>

  <!-- Note -->
  <div class="note-section" style="margin-top: 20px;">
    <label>ADD NOTE</label>
    <ion-input 
      [(ngModel)]="note" 
      placeholder="Extra context here..."
      class="note-input"
    ></ion-input>
  </div>

  <!-- Confirm Button -->
  <ion-button 
    expand="block" 
    color="primary" 
    class="confirm-btn"
    (click)="confirmTransaction()"
    [disabled]="!title || !amount"
  >
    <ion-icon name="checkmark-circle" slot="start"></ion-icon>
    CONFIRM TRANSACTION
  </ion-button>

</ion-content>
