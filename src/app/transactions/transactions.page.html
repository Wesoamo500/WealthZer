<ion-header class="ion-no-border">
  <ion-toolbar color="background">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" icon="chevron-back-outline" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Transaction History</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="options-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar color="background" class="filters-toolbar">
    <div class="filters-container">
      <ion-chip [class.active]="selectedFilter === 'all'" (click)="setFilter('all')">
        <ion-label>All</ion-label>
      </ion-chip>
      <ion-chip [class.active]="selectedFilter === 'income'" (click)="setFilter('income')">
        <ion-label>Income</ion-label>
      </ion-chip>
      <ion-chip [class.active]="selectedFilter === 'expenses'" (click)="setFilter('expenses')">
        <ion-label>Expenses</ion-label>
      </ion-chip>
      <ion-chip [class.active]="selectedFilter === 'transfers'" (click)="setFilter('transfers')">
        <ion-label>Transfers</ion-label>
      </ion-chip>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="main-container">
    <!-- Skeleton List -->
    <div class="transactions-list-container" *ngIf="isLoading">
      <ion-list lines="none">
        <ion-item *ngFor="let i of [1,2,3,4,5,6]" class="transaction-item skeleton">
          <ion-avatar slot="start" style="width: 44px; height: 44px; border-radius: 12px; border-radius: 12px;">
            <ion-skeleton-text animated></ion-skeleton-text>
          </ion-avatar>
          <ion-label>
            <ion-skeleton-text animated style="width: 60%; height: 16px; margin-bottom: 8px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="width: 40%; height: 12px;"></ion-skeleton-text>
          </ion-label>
          <ion-skeleton-text slot="end" animated style="width: 50px; height: 16px;"></ion-skeleton-text>
        </ion-item>
      </ion-list>
    </div>

    <div class="transactions-list-container" *ngIf="!isLoading && filteredTransactions.length > 0">
      <ion-list lines="none">
        <ion-item *ngFor="let item of filteredTransactions" class="transaction-item">
          <div class="icon-box" [style.background]="item.iconBg" slot="start">
            <ion-icon [name]="item.icon" [style.color]="item.iconColor"></ion-icon>
          </div>
          <ion-label>
            <h3>{{ item.title }}</h3>
            <p>{{ item.subtitle }}</p>
          </ion-label>
          <div class="amount" slot="end" [class.negative]="item.amount < 0">
            {{ item.amount > 0 ? '+' : '' }}{{ item.amount | currency }}
          </div>
        </ion-item>
      </ion-list>
    </div>

    <!-- Empty State -->
    <div class="empty-state-wrapper" *ngIf="!isLoading && filteredTransactions.length === 0">
      <div class="empty-state-content">
        <div class="receipt-icon-container">
          <div class="receipt-shape">
            <div class="receipt-lines">
              <div class="line"></div>
              <div class="line"></div>
            </div>
            <div class="diag-line"></div>
          </div>
        </div>
        
        <h2 class="empty-title">No transactions found</h2>
        <p class="empty-subtitle">Your spending and income history will appear here once you start using the app.</p>
        
        <ion-button class="add-transaction-btn" (click)="openAddTransaction()">
          <ion-icon name="add-circle" slot="start"></ion-icon>
          Add Transaction
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
