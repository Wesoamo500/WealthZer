<ion-header class="ion-no-border">
  <ion-toolbar color="background">
    <ion-title>Profile</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="ellipsis-horizontal" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div class="profile-header">
    <div class="avatar">
      <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Avatar"/>
    </div>
    <h2>Abdul Suleman</h2>
    <p>abdul@wealthzer.com</p>
    <ion-badge color="primary">Pro Member</ion-badge>
  </div>

  <ion-list lines="none" class="settings-list">
    <ion-list-header>
      <ion-label>Account</ion-label>
    </ion-list-header>
    
    <ion-item button detail="true">
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-label>Personal Information</ion-label>
    </ion-item>
    
    <ion-item button detail="true">
      <ion-icon name="card-outline" slot="start"></ion-icon>
      <ion-label>Payment Methods</ion-label>
    </ion-item>

    <ion-list-header>
      <ion-label>Settings</ion-label>
    </ion-list-header>

    <ion-item button detail="true">
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-label>Notifications</ion-label>
    </ion-item>

    <ion-item button detail="true">
      <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
      <ion-label>Security</ion-label>
    </ion-item>

    <ion-item button detail="true">
      <ion-icon name="help-circle-outline" slot="start"></ion-icon>
      <ion-label>Help & Support</ion-label>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="danger" fill="outline" class="logout-btn">
    Log Out
  </ion-button>

</ion-content>
