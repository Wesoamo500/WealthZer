<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">
    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="portfolio" href="/tabs/portfolio">
      <ion-icon aria-hidden="true" name="wallet-outline"></ion-icon>
      <ion-label>Assets</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="transactions" href="/tabs/transactions">
      <ion-icon aria-hidden="true" name="receipt-outline"></ion-icon>
      <ion-label>History</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="budgets" href="/tabs/budgets">
      <ion-icon aria-hidden="true" name="pie-chart-outline"></ion-icon>
      <ion-label>Budget</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

  <!-- Floating Action Button -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="main-fab">
    <ion-fab-button color="primary">
      <ion-icon name="grid-outline" class="main-icon"></ion-icon>
    </ion-fab-button>
    
    <ion-fab-list side="top">
      <ion-fab-button (click)="openAddTransaction()" class="sub-fab-btn">
        <ion-icon name="add-circle-outline"></ion-icon>
        <ion-label class="fab-label">Add Transaction</ion-label>
      </ion-fab-button>
      <ion-fab-button (click)="navigateToAdvisor()" class="sub-fab-btn advisor-btn">
        <ion-icon name="sparkles-outline"></ion-icon>
        <ion-label class="fab-label">Ask Finner AI</ion-label>
      </ion-fab-button>
    </ion-fab-list>
  </ion-fab>
</ion-tabs>
