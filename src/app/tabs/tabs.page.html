<ion-tabs (ionTabsDidChange)="onTabChange($event)">

  <!-- ── Router outlet — each tab loads its own page ───── -->
  <ion-tab-bar slot="bottom" class="wz-tab-bar">

    <!-- Home / Dashboard -->
    <ion-tab-button tab="dashboard" class="wz-tab-btn">
      <ion-icon
        [name]="activeTab === 'dashboard' ? 'home' : 'home-outline'"
        class="wz-tab-icon"
        aria-hidden="true">
      </ion-icon>
      <ion-label class="wz-tab-label">Home</ion-label>
      <span *ngIf="activeTab === 'dashboard'" class="wz-tab-pip" aria-hidden="true"></span>
    </ion-tab-button>

    <!-- Portfolio -->
    <ion-tab-button tab="portfolio" class="wz-tab-btn">
      <ion-icon
        [name]="activeTab === 'portfolio' ? 'bar-chart' : 'bar-chart-outline'"
        class="wz-tab-icon"
        aria-hidden="true">
      </ion-icon>
      <ion-label class="wz-tab-label">Portfolio</ion-label>
      <span *ngIf="activeTab === 'portfolio'" class="wz-tab-pip" aria-hidden="true"></span>
    </ion-tab-button>

    <!-- Centre FAB — Quick Add (not a real tab, triggers modal) -->
    <ion-tab-button tab="quickadd" class="wz-tab-btn wz-tab-btn--fab" disabled>
      <div class="wz-fab" aria-label="Quick add" role="button" tabindex="0">
        <ion-icon name="add-outline" class="wz-fab-icon" aria-hidden="true"></ion-icon>
      </div>
    </ion-tab-button>

    <!-- AI Advisor -->
    <ion-tab-button tab="advisor" class="wz-tab-btn">
      <ion-icon
        [name]="activeTab === 'advisor' ? 'person' : 'person-outline'"
        class="wz-tab-icon"
        aria-hidden="true">
      </ion-icon>
      <ion-label class="wz-tab-label">Advisor</ion-label>
      <span *ngIf="activeTab === 'advisor'" class="wz-tab-pip" aria-hidden="true"></span>
    </ion-tab-button>

    <!-- Markets -->
    <ion-tab-button tab="markets" class="wz-tab-btn">
      <ion-icon
        [name]="activeTab === 'markets' ? 'trending-up' : 'trending-up-outline'"
        class="wz-tab-icon"
        aria-hidden="true">
      </ion-icon>
      <ion-label class="wz-tab-label">Markets</ion-label>
      <span *ngIf="activeTab === 'markets'" class="wz-tab-pip" aria-hidden="true"></span>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
