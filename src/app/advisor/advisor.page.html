<ion-content [fullscreen]="true" [scrollY]="false" class="advisor-content">

  <div class="advisor-layout">

    <!-- ══════════════════════════════════════════════════ -->
    <!-- HEADER                                            -->
    <!-- ══════════════════════════════════════════════════ -->
    <div class="adv-header">
      <button class="icon-btn" aria-label="Go back" routerLink="/tabs/dashboard">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </button>

      <div class="adv-avatar-wrap" aria-hidden="true">
        <div class="adv-avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" fill="var(--wz-text-on-primary)"/>
            <path d="M12 5v2M12 17v2M5 12H3M21 12h-2M7.05 7.05L5.64 5.64M18.36 18.36l-1.41-1.41M7.05 16.95l-1.41 1.41M18.36 5.64l-1.41 1.41"
                  stroke="var(--wz-text-on-primary)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="adv-status-dot"
              [class.adv-status-dot--thinking]="isAiTyping"
              aria-hidden="true">
        </span>
      </div>

      <div class="adv-info">
        <p class="adv-name">Zara — AI Advisor</p>
        <p class="adv-sub">
          <span *ngIf="!isAiTyping">Online · Powered by WealthZer AI</span>
          <span *ngIf="isAiTyping" class="adv-typing-lbl">Thinking...</span>
        </p>
      </div>

    </div>

    <!-- ══════════════════════════════════════════════════ -->
    <!-- CHAT BODY                                         -->
    <!-- ══════════════════════════════════════════════════ -->
    <div class="chat-body" role="log" aria-live="polite" aria-label="Conversation with Zara">

      <!-- Date groups -->
      <ng-container *ngFor="let group of dateGroups; trackBy: trackByGroupDate">

        <!-- Date separator -->
        <div class="date-separator" aria-label="Messages from {{ group.label }}">
          <span class="date-sep-line" aria-hidden="true"></span>
          <span class="date-sep-text">{{ group.label | uppercase }}</span>
          <span class="date-sep-line" aria-hidden="true"></span>
        </div>

        <!-- Messages in group -->
        <ng-container *ngFor="let msg of group.messages; trackBy: trackByMsgId">

          <!-- ── AI message (assistant) ── -->
          <div *ngIf="msg.role === 'assistant'"
               class="msg-row msg-row--ai"
               [class.msg-row--thinking]="msg.isThinking">

            <!-- AI avatar -->
            <div class="ai-avatar-sm" aria-hidden="true">
              <ion-icon name="sparkles-outline" style="font-size:12px;color:var(--wz-text-on-primary);"></ion-icon>
            </div>

            <div class="msg-col">
              <!-- Thinking dots -->
              <div *ngIf="msg.isThinking" class="ai-bubble ai-bubble--thinking" role="status" aria-label="Zara is thinking">
                <span class="think-dot"></span>
                <span class="think-dot"></span>
                <span class="think-dot"></span>
              </div>

              <!-- Real AI content -->
              <div *ngIf="!msg.isThinking" class="ai-bubble">
                <!-- Markdown-parsed content -->
                <div class="msg-text"
                     [innerHTML]="parseMd(msg.content)"
                     aria-label="{{ msg.content }}">
                </div>
                <time class="msg-time"
                      [attr.datetime]="msg.timestamp.toISOString()">
                  {{ msg.timestamp | date:'h:mm a' }}
                </time>
              </div>
            </div>
          </div>

          <!-- ── User message ── -->
          <div *ngIf="msg.role === 'user'"
               class="msg-row msg-row--user">
            <div class="user-bubble">
              <div class="msg-text">{{ msg.content }}</div>
              <time class="msg-time msg-time--user"
                    [attr.datetime]="msg.timestamp.toISOString()">
                {{ msg.timestamp | date:'h:mm a' }}
                <span *ngIf="msg.status === 'sending'" class="msg-sending">·</span>
                <ion-icon *ngIf="msg.status === 'sent'"
                          name="checkmark-done-outline"
                          style="font-size:12px;vertical-align:middle;">
                </ion-icon>
              </time>
            </div>
          </div>

        </ng-container>
      </ng-container>

      <!-- Invisible scroll anchor -->
      <div #chatEnd class="chat-end-anchor" aria-hidden="true"></div>
    </div>

    <!-- ══════════════════════════════════════════════════ -->
    <!-- SMART REPLY CHIPS                                 -->
    <!-- ══════════════════════════════════════════════════ -->
    <div class="smart-replies"
         role="group"
         aria-label="Suggested replies">
      <button
        *ngFor="let reply of smartReplies"
        class="smart-chip"
        (click)="onSmartReply(reply)"
        [disabled]="isAiTyping">
        {{ reply.label }}
      </button>
    </div>

    <!-- ══════════════════════════════════════════════════ -->
    <!-- INPUT BAR                                         -->
    <!-- ══════════════════════════════════════════════════ -->
    <div class="input-bar">

      <!-- Voice button -->
      <button class="voice-btn"
              [class.voice-btn--listening]="isListening"
              (click)="onVoiceInput()"
              [attr.aria-label]="isListening ? 'Stop listening' : 'Start voice input'"
              [attr.aria-pressed]="isListening">
        <ion-icon name="mic-outline"
                  [class.voice-icon--active]="isListening">
        </ion-icon>
      </button>

      <!-- Text input -->
      <div class="input-wrap"
           [class.input-wrap--focused]="inputText.length > 0">
        <textarea
          #inputEl
          class="chat-input"
          [value]="inputText"
          (input)="onInputChange($any($event.target).value)"
          placeholder="Ask Zara anything about your finances..."
          rows="1"
          autocomplete="off"
          aria-label="Message input">
        </textarea>
      </div>

      <!-- Send button -->
      <button class="send-btn"
              [class.send-btn--active]="canSend()"
              (click)="onSend()"
              [disabled]="!canSend() || isAiTyping"
              aria-label="Send message">
        <ion-icon name="send-outline"></ion-icon>
      </button>

    </div><!-- /.input-bar -->

  </div><!-- /.advisor-layout -->

</ion-content>
