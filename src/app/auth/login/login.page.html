<ion-content class="ion-padding">
  <div class="login-container">
    
    <!-- Logo -->
    <div class="logo-section">
      <div class="app-logo">
        <ion-icon name="trending-up"></ion-icon>
      </div>
      <h1>Login to Your Account</h1>
      <p class="subtitle">Welcome back to your AI wealth manager</p>
    </div>

    <!-- Login Form -->
    <form class="login-form">
      
      <!-- Email Input -->
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="Enter your email"
            class="custom-input"
          />
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <div class="label-row">
          <label>Password</label>
          <button type="button" class="forgot-link" (click)="forgotPassword()">
            Forgot Password?
          </button>
        </div>
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password"
            placeholder="Enter your password"
            class="custom-input"
          />
          <ion-icon 
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="toggle-password"
            (click)="togglePasswordVisibility()"
          ></ion-icon>
        </div>
      </div>

      <!-- Login Button -->
      <ion-button 
        expand="block" 
        color="primary" 
        class="login-btn"
        (click)="login()"
      >
        Log In
      </ion-button>

    </form>

    <!-- Social Login -->
    <div class="social-section">
      <div class="divider">
        <span>Or continue with</span>
      </div>

      <div class="social-buttons">
        <button class="social-btn" (click)="socialLogin('google')">
          <ion-icon name="logo-google"></ion-icon>
          <span>Google</span>
        </button>
        <button class="social-btn" (click)="socialLogin('apple')">
          <ion-icon name="logo-apple"></ion-icon>
          <span>Apple</span>
        </button>
      </div>
    </div>

    <!-- Register Link -->
    <div class="register-section">
      <span>Don't have an account?</span>
      <a routerLink="/auth/register" class="register-link">Register Now</a>
    </div>

  </div>
</ion-content>
